<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - Hospital Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar starts here -->
    <nav class="navbar">
        <div class="navbar-container">
            <h1 class="navbar-title">Hospital Management System</h1>
            <ul class="navbar-menu">
                <li><a href="index.html" class="navbar-link">Home</a></li>
                <li><a href="doctors.html" class="navbar-link">Doctors</a></li>
                <li><a href="patients.html" class="navbar-link active">Patients</a></li>
                <li><a href="appointments.html" class="navbar-link">Appointments</a></li>
                <li><a href="billing.html" class="navbar-link">Billing</a></li>
            </ul>
        </div>
    </nav>
    <!-- Navbar ends here -->

    <!-- Main container starts here -->
    <div class="main-container">
        <!-- Page title starts here -->
        <h2 class="page-title">Patient Management</h2>
        <!-- Page title ends here -->

        <!-- Add Patient section starts here -->
        <div class="form-section">
            <h3>Add New Patient</h3>
            
            <!-- Form for adding patient -->
            <form id="addPatientForm" class="form">
                <!-- Patient ID input -->
                <div class="form-group">
                    <label for="patientId">Patient ID:</label>
                    <input type="text" id="patientId" placeholder="Enter Patient ID" required>
                </div>

                <!-- Patient Name input -->
                <div class="form-group">
                    <label for="patientName">Name:</label>
                    <input type="text" id="patientName" placeholder="Enter Patient Name" required>
                </div>

                <!-- Patient Age input -->
                <div class="form-group">
                    <label for="patientAge">Age:</label>
                    <input type="number" id="patientAge" placeholder="Enter Age" required>
                </div>

                <!-- Patient Disease input -->
                <div class="form-group">
                    <label for="patientDisease">Disease:</label>
                    <input type="text" id="patientDisease" placeholder="Example: Fever, Cough" required>
                </div>

                <!-- Initial Bill input -->
                <div class="form-group">
                    <label for="patientInitialBill">Initial Bill:</label>
                    <input type="number" id="patientInitialBill" placeholder="Enter Initial Bill in Rupees" required>
                </div>

                <!-- Submit button -->
                <button type="submit" class="btn">Add Patient</button>
            </form>
            <!-- Form ends here -->
        </div>
        <!-- Add Patient section ends here -->

        <!-- Search Patient section starts here -->
        <div class="search-section">
            <h3>Search Patient</h3>
            <div class="search-group">
                <input type="text" id="searchPatientId" placeholder="Enter Patient ID to search">
                <button class="btn" onclick="searchPatient()">Search</button>
            </div>
            <div id="searchPatientResult" class="search-result"></div>
        </div>
        <!-- Search Patient section ends here -->

        <!-- View Patients section starts here -->
        <div class="table-section">
            <h3>All Patients</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Disease</th>
                        <th>Initial Bill</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="patientsTableBody">
                    <!-- Patients will be added here by JavaScript -->
                </tbody>
            </table>
        </div>
        <!-- View Patients section ends here -->
    </div>
    <!-- Main container ends here -->

    <!-- Script files -->
    <script src="script.js"></script>
    <script>
        document.getElementById('addPatientForm').addEventListener('submit', addNewPatient);
        window.addEventListener('load', displayPatients);
    </script>
</body>
</html>
