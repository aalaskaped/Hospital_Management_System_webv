<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - Hospital Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar starts here -->
    <nav class="navbar">
        <div class="navbar-container">
            <h1 class="navbar-title">Hospital Management System</h1>
            <ul class="navbar-menu">
                <li><a href="index.html" class="navbar-link">Home</a></li>
                <li><a href="doctors.html" class="navbar-link active">Doctors</a></li>
                <li><a href="patients.html" class="navbar-link">Patients</a></li>
                <li><a href="appointments.html" class="navbar-link">Appointments</a></li>
                <li><a href="billing.html" class="navbar-link">Billing</a></li>
            </ul>
        </div>
    </nav>
    <!-- Navbar ends here -->

    <!-- Main container starts here -->
    <div class="main-container">
        <!-- Page title starts here -->
        <h2 class="page-title">Doctor Management</h2>
        <!-- Page title ends here -->

        <!-- Add Doctor section starts here -->
        <div class="form-section">
            <h3>Add New Doctor</h3>
            
            <!-- Form for adding doctor -->
            <form id="addDoctorForm" class="form">
                <!-- Doctor ID input -->
                <div class="form-group">
                    <label for="doctorId">Doctor ID:</label>
                    <input type="text" id="doctorId" placeholder="Enter Doctor ID" required>
                </div>

                <!-- Doctor Name input -->
                <div class="form-group">
                    <label for="doctorName">Name:</label>
                    <input type="text" id="doctorName" placeholder="Enter Doctor Name" required>
                </div>

                <!-- Doctor Age input -->
                <div class="form-group">
                    <label for="doctorAge">Age:</label>
                    <input type="number" id="doctorAge" placeholder="Enter Age" required>
                </div>

                <!-- Doctor Specialization input -->
                <div class="form-group">
                    <label for="doctorSpecialization">Specialization:</label>
                    <input type="text" id="doctorSpecialization" placeholder="Example: Cardiologist" required>
                </div>

                <!-- Doctor Consultation Fees input -->
                <div class="form-group">
                    <label for="doctorFees">Consultation Fees:</label>
                    <input type="number" id="doctorFees" placeholder="Enter Fees in Rupees" required>
                </div>

                <!-- Submit button -->
                <button type="submit" class="btn">Add Doctor</button>
            </form>
            <!-- Form ends here -->
        </div>
        <!-- Add Doctor section ends here -->

        <!-- Search Doctor section starts here -->
        <div class="search-section">
            <h3>Search Doctor</h3>
            <div class="search-group">
                <input type="text" id="searchDoctorId" placeholder="Enter Doctor ID to search">
                <button class="btn" onclick="searchDoctor()">Search</button>
            </div>
            <div id="searchDoctorResult" class="search-result"></div>
        </div>
        <!-- Search Doctor section ends here -->

        <!-- View Doctors section starts here -->
        <div class="table-section">
            <h3>All Doctors</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>Doctor ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Specialization</th>
                        <th>Consultation Fees</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="doctorsTableBody">
                    <!-- Doctors will be added here by JavaScript -->
                </tbody>
            </table>
        </div>
        <!-- View Doctors section ends here -->
    </div>
    <!-- Main container ends here -->

    <!-- Script files -->
    <script src="script.js"></script>
    <script>
        // Function to display all doctors in the table
        function displayDoctors() {
            let tableBody = document.getElementById('doctorsTableBody');
            tableBody.innerHTML = ''; // Clear the table first

            // Loop through all doctors and add them to the table
            for (let i = 0; i < doctorsArray.length; i++) {
                let doctor = doctorsArray[i];
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td>${doctor.id}</td>
                    <td>${doctor.name}</td>
                    <td>${doctor.age}</td>
                    <td>${doctor.specialization}</td>
                    <td>${doctor.fees}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteDoctor('${doctor.id}')">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            }
        }

        // Function to add a new doctor
        function addNewDoctor(event) {
            event.preventDefault(); // Stop form from refreshing the page

            // Get values from form
            let doctorId = document.getElementById('doctorId').value;
            let doctorName = document.getElementById('doctorName').value;
            let doctorAge = document.getElementById('doctorAge').value;
            let doctorSpec = document.getElementById('doctorSpecialization').value;
            let doctorFees = document.getElementById('doctorFees').value;

            // Create a new doctor object
            let newDoctor = {
                id: doctorId,
                name: doctorName,
                age: doctorAge,
                specialization: doctorSpec,
                fees: doctorFees
            };

            // Add the new doctor to the array
            doctorsArray.push(newDoctor);

            // Clear the form
            document.getElementById('addDoctorForm').reset();

            // Show a message
            alert('Doctor added successfully!');

            // Update the table
            displayDoctors();
        }

        // Function to delete a doctor
        function deleteDoctor(docId) {
            // Ask user for confirmation
            let confirmDelete = confirm('Are you sure you want to delete this doctor?');
            
            if (confirmDelete) {
                // Find the doctor and remove from array
                for (let i = 0; i < doctorsArray.length; i++) {
                    if (doctorsArray[i].id === docId) {
                        doctorsArray.splice(i, 1); // Remove doctor at position i
                        alert('Doctor deleted successfully!');
                        displayDoctors(); // Update the table
                        return;
                    }
                }
            }
        }

        // Function to search for a doctor
        function searchDoctor() {
            let searchId = document.getElementById('searchDoctorId').value;
            let resultDiv = document.getElementById('searchDoctorResult');
            resultDiv.innerHTML = ''; // Clear previous results

            // Find the doctor with matching ID
            for (let i = 0; i < doctorsArray.length; i++) {
                if (doctorsArray[i].id === searchId) {
                    let doctor = doctorsArray[i];
                    resultDiv.innerHTML = `
                        <div class="search-result-box">
                            <p><strong>Doctor ID:</strong> ${doctor.id}</p>
                            <p><strong>Name:</strong> ${doctor.name}</p>
                            <p><strong>Age:</strong> ${doctor.age}</p>
                            <p><strong>Specialization:</strong> ${doctor.specialization}</p>
                            <p><strong>Consultation Fees:</strong> ${doctor.fees}</p>
                        </div>
                    `;
                    return;
                }
            }

            // If doctor not found, show message
            resultDiv.innerHTML = '<p style="color: red;">Doctor not found!</p>';
        }

        // Add event listener to form
        document.getElementById('addDoctorForm').addEventListener('submit', addNewDoctor);

        // Display doctors when page loads
        window.addEventListener('load', displayDoctors);
    </script>
</body>
</html>
